<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="title description">
  <title id="title">Officina 02 — conservare il telaio, inserire i volumi</title>
  <desc id="description">Sezione trasversale concettuale: il telaio a doppia falda esistente è in grafite; due nuovi laboratori bassi, blu e tratteggiati, restano separati da pilastri e copertura. Al centro rimane la dorsale comune, rappresentata in sezione. Numeri 01 struttura conservata, 02 distacco superiore, 03 nuovi elementi. Schema non in scala, senza verifiche strutturali.</desc>
