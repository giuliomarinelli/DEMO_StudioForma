<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="title description">
  <title id="title">Corte 01 — ingresso, corte e ambienti</title>
  <desc id="description">Pianta concettuale a U. Il percorso blu entra dal filtro nell'ala sinistra, raggiunge la corte e si dirama verso lo spazio giorno superiore e gli ambienti privati a destra. Numeri 01 ingresso, 02 corte distributiva, 03 soglie degli ambienti. Schema non in scala di un progetto fittizio non realizzato.</desc>
