<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="title description">
  <title id="title">Interno 03 — configurazione separata</title>
  <desc id="description">La stessa pianta della configurazione aperta: i pannelli ora occupano il varco orizzontale e separano lo studio dallo spazio comune. La freccia indica lo scorrimento verso sinistra, il tratteggio identifica lo spazio di lavoro distinto. Nucleo, notte e arredi non cambiano. Non sono attestate prestazioni acustiche. Schema non in scala di un progetto fittizio non realizzato.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#86919A" stroke-opacity=".2"/></pattern>
